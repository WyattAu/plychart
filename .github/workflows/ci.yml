name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --workspace

  wasm-pack:
    name: Wasm Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: taiki-e/install-action@wasm-pack
      - run: bash scripts/build-wasm.sh
      - name: Verify pkg/ output
        run: |
          ls crates/plychart/pkg/
          test -f crates/plychart/pkg/plychart_bg.wasm
          test -f crates/plychart/pkg/plychart.js
          echo "pkg/ output verified"
          echo "Exports: $(grep -c '^export function' crates/plychart/pkg/plychart.js)"
          # Guard: fail if fewer than 20 exports (catches wasm-bindgen schema mismatch)
          test "$(grep -c '^export function' crates/plychart/pkg/plychart.js)" -ge 20

  wasm-test:
    name: Wasm Browser Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - uses: taiki-e/install-action@wasm-pack
      - name: Run browser tests (tests/wasm.rs)
        run: wasm-pack test --headless --chrome crates/plychart
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  publish-dry-run:
    name: Publish Dry Run
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, wasm-pack, wasm-test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publish-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Dry run publish plycore
        run: cargo publish --dry-run -p plycore
      - name: Dry run publish plycompute
        run: cargo publish --dry-run -p plycompute
      - name: Dry run publish plychart
        run: cargo publish --dry-run -p plychart