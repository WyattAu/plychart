[workspace]
members = [
    "crates/plychart",
    "crates/plycompute",
    "crates/plycore",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Wyatt Au"]
repository = "https://github.com/WyattAu/plychart"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
web-sys = "=0.3.77"
console_error_panic_hook = "0.1"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
