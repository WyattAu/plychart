<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>plychart Demo — 13 Chart Types</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #e0e0e0; font-family: 'JetBrains Mono', monospace; }
        .header { padding: 2rem; text-align: center; border-bottom: 1px solid #333; }
        .header h1 { font-size: 2rem; color: #c8a23c; }
        .header p { color: #666; margin-top: 0.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 1rem; padding: 1rem; }
        .chart-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        .chart-card h3 { padding: 0.75rem 1rem; font-size: 0.9rem; color: #c8a23c; border-bottom: 1px solid #333; }
        .chart-card canvas { width: 100%; height: 300px; display: block; }
        .chart-card .controls { padding: 0.5rem 1rem; display: flex; gap: 0.5rem; }
        .chart-card button { background: #333; color: #e0e0e0; border: none; padding: 0.25rem 0.75rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .chart-card button:hover { background: #444; }
        .chart-card .status { padding: 0.25rem 1rem; font-size: 0.75rem; color: #666; }
        .footer { padding: 2rem; text-align: center; border-top: 1px solid #333; color: #666; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>plychart</h1>
        <p>13 chart types • Zero dependencies • Canvas2D rendering</p>
    </div>
    <div class="grid" id="charts"></div>
    <div class="footer">
        <p>Built with Rust/WASM • <a href="https://crates.io/crates/plychart" style="color:#c8a23c">crates.io</a> • <a href="https://github.com/WyattAu/plychart" style="color:#c8a23c">GitHub</a></p>
    </div>
    <script type="module" src="./app.js"></script>
</body>
</html>
