[package]
name = "plycompute"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Quantitative computation library — portfolio analytics, risk metrics, signal processing"
repository = "https://github.com/WyattAu/plychart"

[dependencies]
plycore = { path = "../plycore", version = "0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
# Opt-in for building plycompute itself as a cdylib. Dependency crates
# (hydrated-widgets) must NOT enable it: wasm-bindgen describe symbols
# for same-named exports collide at link time.
wasm-exports = []
