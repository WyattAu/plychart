[package]
name = "plychart"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Full-featured graphing library for Rust/WASM — Canvas2D rendering, zero dependencies, zero watermarks"
repository = "https://github.com/WyattAu/plychart"
keywords = ["charting", "canvas", "wasm", "visualization", "data"]
categories = ["wasm", "visualization", "graphics"]
readme = "README.md"
authors = ["Wyatt Au"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plycore = { path = "../plycore", version = "0.2.0" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "TextMetrics",
    "Window",
    "console",
    "ImageData",
    "Performance",
    "Node",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

# Native-only dev-dependencies: criterion does not compile on wasm32, and
# proptest 1.x pulls rand 0.9 -> getrandom 0.3, which needs the wasm_js
# backend on wasm32-unknown-unknown. Both are only used by the native test
# and bench suites; browser tests (tests/wasm.rs) use wasm-bindgen-test.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[[bench]]
name = "chart_render"
harness = false
